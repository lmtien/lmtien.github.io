<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="390" viewBox="0 0 1100 390" role="img" aria-labelledby="t d"><title id="t">How an agent loads a skill</title><desc id="d">The host exposes skill metadata, a matching task activates instructions, and supporting resources are loaded when needed. The model uses these with its tools; its weights are unchanged.</desc><rect width="1100" height="390" rx="22" fill="#102238"/><g font-family="sans-serif"><text x="40" y="52" font-size="28" fill="#eef7ff">A skill adds a workflow to the agent's context</text><g fill="#d6eaff"><rect x="40" y="100" width="290" height="140" rx="14"/><rect x="405" y="100" width="290" height="140" rx="14"/><rect x="770" y="100" width="290" height="140" rx="14"/></g><g fill="#102238" text-anchor="middle"><text x="185" y="145" font-size="23">1. Discover</text><text x="185" y="183" font-size="18">name + description</text><text x="185" y="213" font-size="16">host advertises available skills</text><text x="550" y="145" font-size="23">2. Activate</text><text x="550" y="183" font-size="18">read SKILL.md</text><text x="550" y="213" font-size="16">explicit request or task match</text><text x="915" y="145" font-size="23">3. Apply</text><text x="915" y="183" font-size="18">references + scripts as needed</text><text x="915" y="213" font-size="16">agent uses permitted tools</text></g><g stroke="#b3d7ee" stroke-width="4" fill="none"><path d="M345 170h43m-12-10 12 10-12 10M710 170h43m-12-10 12 10-12 10"/></g><text x="40" y="295" font-size="21" fill="#bcebd3">Same model weights. Different instructions and resources.</text><text x="40" y="337" font-size="18" fill="#a8c2da">Loading is managed by the host; installing a folder alone does not prove activation.</text></g></svg>