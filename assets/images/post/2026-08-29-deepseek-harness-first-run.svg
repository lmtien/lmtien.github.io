<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">A practical first run with DeepSeek Harness</title>
  <desc id="desc">Five steps from launching the Web UI to inspecting the agent trajectory.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="620" rx="28" fill="#0b1120"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">My first useful run</text>
  <text x="70" y="116" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Start read-only, inspect the trace, then decide whether the agent earns write access.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif" text-anchor="middle">
    <rect x="55" y="205" width="190" height="190" rx="18" fill="#172033" stroke="#38bdf8" stroke-width="2"/>
    <circle cx="150" cy="252" r="23" fill="#0369a1"/><text x="150" y="259" fill="#f0f9ff" font-size="18" font-weight="700">1</text>
    <text x="150" y="309" fill="#f8fafc" font-size="19" font-weight="700">Launch</text>
    <text x="150" y="343" fill="#94a3b8" font-size="12">npx @deepseek-ai/dsh web</text>

    <rect x="280" y="205" width="190" height="190" rx="18" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <circle cx="375" cy="252" r="23" fill="#6d28d9"/><text x="375" y="259" fill="#f5f3ff" font-size="18" font-weight="700">2</text>
    <text x="375" y="309" fill="#f8fafc" font-size="19" font-weight="700">Model</text>
    <text x="375" y="343" fill="#94a3b8" font-size="14">add provider key</text>

    <rect x="505" y="205" width="190" height="190" rx="18" fill="#172033" stroke="#34d399" stroke-width="2"/>
    <circle cx="600" cy="252" r="23" fill="#047857"/><text x="600" y="259" fill="#ecfdf5" font-size="18" font-weight="700">3</text>
    <text x="600" y="309" fill="#f8fafc" font-size="19" font-weight="700">Workspace</text>
    <text x="600" y="343" fill="#94a3b8" font-size="14">select one repo</text>

    <rect x="730" y="205" width="190" height="190" rx="18" fill="#172033" stroke="#fbbf24" stroke-width="2"/>
    <circle cx="825" cy="252" r="23" fill="#b45309"/><text x="825" y="259" fill="#fffbeb" font-size="18" font-weight="700">4</text>
    <text x="825" y="309" fill="#f8fafc" font-size="19" font-weight="700">Read-only task</text>
    <text x="825" y="343" fill="#94a3b8" font-size="14">understand risks</text>

    <rect x="955" y="205" width="190" height="190" rx="18" fill="#172033" stroke="#fb7185" stroke-width="2"/>
    <circle cx="1050" cy="252" r="23" fill="#be123c"/><text x="1050" y="259" fill="#fff1f2" font-size="18" font-weight="700">5</text>
    <text x="1050" y="309" fill="#f8fafc" font-size="19" font-weight="700">Trajectory</text>
    <text x="1050" y="343" fill="#94a3b8" font-size="14">inspect every step</text>
  </g>

  <g stroke="#64748b" stroke-width="4" marker-end="url(#arrow)">
    <line x1="247" y1="300" x2="272" y2="300"/>
    <line x1="472" y1="300" x2="497" y2="300"/>
    <line x1="697" y1="300" x2="722" y2="300"/>
    <line x1="922" y1="300" x2="947" y2="300"/>
  </g>

  <rect x="245" y="472" width="710" height="72" rx="14" fill="#111827" stroke="#475569"/>
  <text x="600" y="501" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="17" font-weight="700">Only expand permissions after the agent proves it understands the repository.</text>
  <text x="600" y="528" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="15">Small task, visible reasoning, reversible next step.</text>
</svg>
