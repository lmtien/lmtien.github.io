<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="400" viewBox="0 0 1100 400" role="img" aria-labelledby="t d"><title id="t">A mixed website and desktop automation workflow</title><desc id="d">Playwright exports a report, a watcher observes a finalized file, Python validates and deduplicates it, and an optional macOS adapter notifies and opens TextEdit. The native macOS step was not tested.</desc><rect width="1100" height="400" rx="20" fill="#102238"/><g font-family="sans-serif"><text x="35" y="48" font-size="27" fill="#edf7ff">One coordinator, a supported adapter for each surface</text><g fill="#d9efff"><rect x="35" y="100" width="230" height="140" rx="12"/><rect x="300" y="100" width="230" height="140" rx="12"/><rect x="565" y="100" width="230" height="140" rx="12"/></g><rect x="830" y="100" width="235" height="140" rx="12" fill="#d0eadc" stroke="#99cdb5" stroke-width="3" stroke-dasharray="8 6"/><g fill="#17334b" text-anchor="middle"><text x="150" y="142" font-size="23">Browser</text><text x="150" y="178" font-size="17">locator + download event</text><text x="150" y="211" font-size="16">Playwright</text><text x="415" y="142" font-size="23">File handoff</text><text x="415" y="178" font-size="17">.part → finalized .csv</text><text x="415" y="211" font-size="16">watchdog</text><text x="680" y="142" font-size="23">Local processing</text><text x="680" y="178" font-size="17">validate + hash + summary</text><text x="680" y="211" font-size="16">Python + SQLite</text><text x="947" y="142" font-size="23">Mac action</text><text x="947" y="178" font-size="17">notify + open TextEdit</text><text x="947" y="211" font-size="16">optional · native untested</text></g><g fill="none" stroke="#bdddf2" stroke-width="3"><path d="M273 169h18m-7-7 7 7-7 7M538 169h18m-7-7 7 7-7 7M803 169h18m-7-7 7 7-7 7"/></g><text x="35" y="292" fill="#c8e6f6" font-size="19">Actually tested: local Chromium → filesystem events → summary and duplicate detection.</text><text x="35" y="338" fill="#aac4d8" font-size="18">Supported interfaces improve reliability. They do not make a bot undetectable.</text></g></svg>