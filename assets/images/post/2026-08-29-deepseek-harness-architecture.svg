<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness architecture</title>
  <desc id="desc">An AI agent consists of a model surrounded by a configurable harness of plugins.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="12" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="700" rx="28" fill="#0b1120"/>
  <text x="70" y="82" fill="#f8fafc" font-family="Arial, sans-serif" font-size="38" font-weight="700">Agent = Model + Harness</text>
  <text x="70" y="122" fill="#94a3b8" font-family="Arial, sans-serif" font-size="19">The model reasons. The harness connects that reasoning to real work.</text>

  <g filter="url(#shadow)">
    <rect x="90" y="190" width="330" height="380" rx="24" fill="#172033" stroke="#475569" stroke-width="2"/>
    <text x="255" y="246" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="22" font-weight="700">MODEL</text>
    <circle cx="255" cy="375" r="92" fill="#1d4ed8" stroke="#60a5fa" stroke-width="4"/>
    <circle cx="255" cy="375" r="58" fill="#0f172a" stroke="#93c5fd" stroke-width="2"/>
    <text x="255" y="366" text-anchor="middle" fill="#f8fafc" font-family="Arial, sans-serif" font-size="20" font-weight="700">reason</text>
    <text x="255" y="397" text-anchor="middle" fill="#bfdbfe" font-family="Arial, sans-serif" font-size="16">decide</text>
    <text x="255" y="523" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="16">DeepSeek or another provider</text>
  </g>

  <line x1="440" y1="380" x2="505" y2="380" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="525" y="170" width="585" height="420" rx="24" fill="#111827" stroke="#22d3ee" stroke-width="3"/>
    <text x="817" y="222" text-anchor="middle" fill="#67e8f9" font-size="22" font-weight="700">HARNESS: A COMPOSED PLUGIN TREE</text>

    <g font-size="17" font-weight="700" text-anchor="middle">
      <rect x="575" y="270" width="145" height="62" rx="10" fill="#0f766e"/><text x="647" y="308" fill="#ecfeff">Tools</text>
      <rect x="745" y="270" width="145" height="62" rx="10" fill="#7c3aed"/><text x="817" y="308" fill="#f5f3ff">Sessions</text>
      <rect x="915" y="270" width="145" height="62" rx="10" fill="#b45309"/><text x="987" y="308" fill="#fffbeb">Storage</text>
      <rect x="575" y="365" width="145" height="62" rx="10" fill="#0369a1"/><text x="647" y="403" fill="#f0f9ff">Sandbox</text>
      <rect x="745" y="365" width="145" height="62" rx="10" fill="#be123c"/><text x="817" y="403" fill="#fff1f2">Agent loop</text>
      <rect x="915" y="365" width="145" height="62" rx="10" fill="#4d7c0f"/><text x="987" y="403" fill="#f7fee7">Skills</text>
      <rect x="660" y="460" width="145" height="62" rx="10" fill="#334155"/><text x="732" y="498" fill="#f8fafc">Scheduler</text>
      <rect x="830" y="460" width="145" height="62" rx="10" fill="#9f1239"/><text x="902" y="498" fill="#fff1f2">UI</text>
    </g>
  </g>
  <text x="600" y="650" text-anchor="middle" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Swap one capability without rewriting the entire agent.</text>
</svg>
