<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="460" viewBox="0 0 1100 460" role="img" aria-labelledby="t d"><title id="t">Agent Autoloop event and decision flow</title><desc id="d">An event matches a rule, launches a CLI job, and receives a result. A question ends the job and waits; a human answer creates a new job. The hub stays online.</desc><rect width="1100" height="460" rx="22" fill="#102238"/><g font-family="sans-serif"><text x="35" y="48" fill="#ecf7ff" font-size="28">The hub stays online. Each CLI job can finish.</text><g fill="#dceeff"><rect x="35" y="90" width="205" height="100" rx="12"/><rect x="300" y="90" width="205" height="100" rx="12"/><rect x="565" y="90" width="205" height="100" rx="12"/><rect x="830" y="90" width="235" height="100" rx="12"/></g><g fill="#102238" text-anchor="middle" font-size="23"><text x="137" y="135">Event</text><text x="402" y="135">Rule</text><text x="667" y="135">CLI job</text><text x="947" y="135">Result / receipt</text></g><g fill="#36566f" text-anchor="middle" font-size="17"><text x="137" y="165">timer or external input</text><text x="402" y="165">agent + directory</text><text x="667" y="165">process exits</text><text x="947" y="165">done, ask, or later</text></g><g stroke="#b4d8ef" stroke-width="4" fill="none"><path d="M250 140h38m-10-9 10 9-10 9M515 140h38m-10-9 10 9-10 9M780 140h38m-10-9 10 9-10 9M947 200v55H700m12-9-12 9 12 9M480 305H140V200m-9 12 9-12 9 12"/></g><rect x="500" y="265" width="410" height="100" rx="12" fill="#c8efdc"/><text x="705" y="305" text-anchor="middle" font-size="24" fill="#102238">Wait for a human answer</text><text x="705" y="338" text-anchor="middle" font-size="18" fill="#36566f">no active CLI task is needed while waiting</text><text x="165" y="286" fill="#cee9fb" font-size="18">answer becomes an event</text><text x="35" y="421" fill="#b7cfdf" font-size="18">This is orchestration. Model quality, tools, and real-world verification remain separate concerns.</text></g></svg>