<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc">
  <title id="title">DeepSeek Harness plugin composition</title>
  <desc id="desc">Profiles combine bundles, bundles add plugin rows, and Cordis connects plugin services and dependencies.</desc>
  <defs>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#020617" flood-opacity="0.45"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L0,6 L9,3 z" fill="#38bdf8"/>
    </marker>
  </defs>
  <rect width="1200" height="720" rx="28" fill="#0b1120"/>
  <text x="70" y="78" fill="#f8fafc" font-family="Arial, sans-serif" font-size="36" font-weight="700">How the plugin tree is composed</text>
  <text x="70" y="116" fill="#94a3b8" font-family="Arial, sans-serif" font-size="18">Profiles choose bundles. Bundles contribute configuration. Cordis mounts the plugins.</text>

  <g filter="url(#shadow)" font-family="Arial, sans-serif">
    <rect x="70" y="185" width="260" height="360" rx="20" fill="#172033" stroke="#7dd3fc" stroke-width="2"/>
    <text x="200" y="234" text-anchor="middle" fill="#bae6fd" font-size="22" font-weight="700">PROFILE</text>
    <text x="200" y="270" text-anchor="middle" fill="#94a3b8" font-size="15">reviewer</text>
    <rect x="105" y="312" width="190" height="58" rx="10" fill="#1e3a8a"/>
    <text x="200" y="347" text-anchor="middle" fill="#dbeafe" font-size="17">dsh-base</text>
    <rect x="105" y="392" width="190" height="58" rx="10" fill="#155e75"/>
    <text x="200" y="427" text-anchor="middle" fill="#cffafe" font-size="17">web-app</text>
    <rect x="105" y="472" width="190" height="58" rx="10" fill="#7c2d12"/>
    <text x="200" y="507" text-anchor="middle" fill="#ffedd5" font-size="17">policy bundle</text>

    <rect x="470" y="185" width="260" height="360" rx="20" fill="#172033" stroke="#a78bfa" stroke-width="2"/>
    <text x="600" y="234" text-anchor="middle" fill="#ddd6fe" font-size="22" font-weight="700">CONFIG ROWS</text>
    <rect x="505" y="292" width="190" height="54" rx="10" fill="#4c1d95"/>
    <text x="600" y="325" text-anchor="middle" fill="#f5f3ff" font-size="16">model adapter</text>
    <rect x="505" y="365" width="190" height="54" rx="10" fill="#115e59"/>
    <text x="600" y="398" text-anchor="middle" fill="#ccfbf1" font-size="16">read-only tools</text>
    <rect x="505" y="438" width="190" height="54" rx="10" fill="#9f1239"/>
    <text x="600" y="471" text-anchor="middle" fill="#ffe4e6" font-size="16">approval policy</text>

    <rect x="870" y="185" width="260" height="360" rx="20" fill="#172033" stroke="#34d399" stroke-width="2"/>
    <text x="1000" y="234" text-anchor="middle" fill="#a7f3d0" font-size="22" font-weight="700">CORDIS</text>
    <circle cx="1000" cy="330" r="64" fill="#065f46" stroke="#6ee7b7" stroke-width="3"/>
    <text x="1000" y="324" text-anchor="middle" fill="#ecfdf5" font-size="17" font-weight="700">mount</text>
    <text x="1000" y="348" text-anchor="middle" fill="#a7f3d0" font-size="14">dependencies</text>
    <text x="1000" y="440" text-anchor="middle" fill="#cbd5e1" font-size="16">services + events</text>
    <text x="1000" y="472" text-anchor="middle" fill="#cbd5e1" font-size="16">automatic cleanup</text>
  </g>

  <line x1="342" y1="365" x2="452" y2="365" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>
  <line x1="742" y1="365" x2="852" y2="365" stroke="#38bdf8" stroke-width="5" marker-end="url(#arrow)"/>

  <rect x="310" y="606" width="580" height="58" rx="12" fill="#111827" stroke="#475569"/>
  <text x="600" y="642" text-anchor="middle" fill="#cbd5e1" font-family="Arial, sans-serif" font-size="17">A profile is a repeatable recipe for one kind of agent.</text>
</svg>
