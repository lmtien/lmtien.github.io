<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="280" viewBox="0 0 1000 280" role="img" aria-labelledby="title desc">
<title id="title">CloakBrowser workflow</title><desc id="desc">A Python script uses the CloakBrowser wrapper to launch a modified Chromium browser and capture a page.</desc>
<rect width="1000" height="280" rx="22" fill="#102238"/><text x="40" y="46" fill="#dceeff" font-family="sans-serif" font-size="24">A small browser automation workflow</text>
<g font-family="sans-serif" text-anchor="middle"><rect x="35" y="86" width="205" height="120" rx="14" fill="#d6eaff"/><text x="137" y="130" font-size="22" fill="#102238">Python script</text><text x="137" y="164" font-size="16" fill="#34516a">navigate + screenshot</text><rect x="285" y="86" width="205" height="120" rx="14" fill="#c7f3df"/><text x="387" y="130" font-size="22" fill="#102238">CloakBrowser</text><text x="387" y="164" font-size="16" fill="#34516a">wrapper + license</text><rect x="535" y="86" width="205" height="120" rx="14" fill="#ffe4b8"/><text x="637" y="130" font-size="22" fill="#102238">Chromium</text><text x="637" y="164" font-size="16" fill="#34516a">modified binary</text><rect x="785" y="86" width="180" height="120" rx="14" fill="#e8d7ff"/><text x="875" y="130" font-size="22" fill="#102238">Your page</text><text x="875" y="164" font-size="16" fill="#34516a">HTML + screenshot</text></g><g stroke="#e8f4ff" stroke-width="4" fill="none"><path d="M245 146h35m-10-9 10 9-10 9M495 146h35m-10-9 10 9-10 9M745 146h35m-10-9 10 9-10 9"/></g></svg>
